# Temporary provider runtime diagnostic for branch agent/fix-image-production-v063
name = "farsiai-api"
main = "src/diagnostics/image-runtime-worker.ts"
compatibility_date = "2026-08-10"
compatibility_flags = ["nodejs_compat"]
keep_vars = true

[ai]
binding = "AI"

[observability]
enabled = true

[[ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "9203101"

  [ratelimits.simple]
  limit = 30
  period = 60

[[ratelimits]]
name = "IMAGE_RATE_LIMITER"
namespace_id = "9203102"

  [ratelimits.simple]
  limit = 6
  period = 60

[vars]
ALLOWED_ORIGIN = "*"
ADMIN_EMAILS = "sorniamir2005@gmail.com"
NANO_BANANA_MODEL = "gemini-3.1-flash-lite-image"
