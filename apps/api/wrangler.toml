name = "farsiai-api"
main = "src/index.ts"
compatibility_date = "2026-08-09"
compatibility_flags = ["nodejs_compat"]
keep_vars = true

[ai]
binding = "AI"

[observability]
enabled = true

[[durable_objects.bindings]]
name = "GUEST_QUOTA"
class_name = "GuestQuotaDurableObject"

[[migrations]]
tag = "guest-quota-v1"
new_sqlite_classes = ["GuestQuotaDurableObject"]

[[ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "9203101"

  [ratelimits.simple]
  limit = 30
  period = 60

[[ratelimits]]
name = "IMAGE_RATE_LIMITER"
namespace_id = "9203102"

  [ratelimits.simple]
  limit = 6
  period = 60

[vars]
ALLOWED_ORIGIN = "*"
