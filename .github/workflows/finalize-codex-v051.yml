name: Finalize Codex v0.5.1

on:
  push:
    branches: ["fix/codex-v050-free-plan"]
    paths:
      - ".github/workflows/finalize-codex-v051.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/codex-v050-free-plan
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch verified model set and version markers
        shell: python
        run: |
          from pathlib import Path

          codex_v2 = Path('apps/api/src/ai/codex-v2.ts')
          text = codex_v2.read_text(encoding='utf-8')
          old = "const MODELS = ['@cf/openai/gpt-oss-120b', '@cf/openai/gpt-oss-20b', '@cf/google/gemma-4-26b-a4b-it', '@cf/zai-org/glm-4.7-flash'] as const;"
          new = "const MODELS = ['@cf/openai/gpt-oss-120b', '@cf/google/gemma-4-26b-a4b-it'] as const;"
          assert old in text
          codex_v2.write_text(text.replace(old, new, 1), encoding='utf-8')

          desktop_codex = Path('apps/desktop/src/services/codex.ts')
          text = desktop_codex.read_text(encoding='utf-8')
          assert "export const CODEX_CLIENT_VERSION = '0.5.0-codex-studio';" in text
          desktop_codex.write_text(text.replace(
            "export const CODEX_CLIENT_VERSION = '0.5.0-codex-studio';",
            "export const CODEX_CLIENT_VERSION = '0.5.1-codex-studio';",
            1,
          ), encoding='utf-8')

          root = Path('package.json')
          text = root.read_text(encoding='utf-8')
          assert '"version": "0.4.7"' in text
          root.write_text(text.replace('"version": "0.4.7"', '"version": "0.5.1"', 1), encoding='utf-8')

      - name: Align npm lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Validate patch
        run: |
          git diff --check
          grep -F "@cf/openai/gpt-oss-120b" apps/api/src/ai/codex-v2.ts
          grep -F "@cf/google/gemma-4-26b-a4b-it" apps/api/src/ai/codex-v2.ts
          if grep -Fq "@cf/openai/gpt-oss-20b" apps/api/src/ai/codex-v2.ts; then exit 1; fi
          if grep -Fq "@cf/zai-org/glm-4.7-flash" apps/api/src/ai/codex-v2.ts; then exit 1; fi
          grep -F "0.5.1-codex-studio" apps/desktop/src/services/codex.ts
      - name: Commit finalization
        shell: bash
        run: |
          git config user.name "FarsiAI CI"
          git config user.email "actions@users.noreply.github.com"
          git add package.json package-lock.json apps/api/src/ai/codex-v2.ts apps/desktop/src/services/codex.ts
          git commit -m "release(codex): finalize v0.5.1 verified model set"
          git push origin HEAD:fix/codex-v050-free-plan
