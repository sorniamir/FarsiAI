name: Desktop Windows

on:
  push:
    branches: [main, "agent/**", "fix/codex-*"]
    paths:
      - "apps/desktop/**"
      - "apps/api/src/ai/agent.ts"
      - "apps/api/src/ai/agent-v2.ts"
      - "apps/api/src/ai/codex-v2.ts"
      - "apps/api/src/ai/voice.ts"
      - "apps/api/src/index.ts"
      - "apps/api/test/**"
      - "apps/api/package.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop-windows.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "apps/api/src/ai/agent.ts"
      - "apps/api/src/ai/agent-v2.ts"
      - "apps/api/src/ai/codex-v2.ts"
      - "apps/api/src/ai/voice.ts"
      - "apps/api/src/index.ts"
      - "apps/api/test/**"
      - "apps/api/package.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop-windows.yml"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL || 'https://farsiai-api.sorniamir2005.workers.dev' }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://amjeqpkdowiqpnbdnlov.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_dmq29e97vQpib77ne8wVWA_DHuzJ9-U' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Typecheck API
        run: npm run check:api

      - name: Typecheck Desktop
        run: npm run check:desktop

      - name: Verify Codex v2 production model contract
        shell: pwsh
        run: |
          $source = Get-Content "apps/api/src/ai/codex-v2.ts" -Raw
          if ($source -notmatch [regex]::Escape("@cf/openai/gpt-oss-120b")) {
            throw "Live-tested GPT-OSS 120B primary model is missing."
          }
          if ($source -notmatch [regex]::Escape("@cf/google/gemma-4-26b-a4b-it")) {
            throw "Live-tested Gemma fallback model is missing."
          }
          foreach ($blocked in @("@cf/moonshotai/kimi-k2.7-code", "@cf/zai-org/glm-5.2", "@cf/openai/gpt-oss-20b", "@cf/zai-org/glm-4.7-flash")) {
            if ($source -match [regex]::Escape($blocked)) {
              throw "Unverified or unavailable Codex model remained in v2: $blocked"
            }
          }
          Write-Host "Verified Codex v2 uses only the live-tested Workers Free model set."

      - name: Verify Codex approval lifecycle regression contract
        shell: pwsh
        run: |
          $service = Get-Content "apps/desktop/src/services/codex.ts" -Raw
          $studio = Get-Content "apps/desktop/src/components/CodexStudio.tsx" -Raw
          $broker = Get-Content "apps/desktop/src-tauri/src/codex_broker.rs" -Raw
          $planner = Get-Content "apps/api/src/ai/codex-v2.ts" -Raw
          if ($service -notmatch [regex]::Escape("expectedSha256 === undefined || expectedSha256 === null")) {
            throw "Codex write pre-read no longer handles null expectedSha256."
          }
          if ($service -notmatch [regex]::Escape("typeof error === 'string'")) {
            throw "Native Tauri string errors are no longer surfaced."
          }
          if ($studio -notmatch [regex]::Escape("const completedWrites = new Map")) {
            throw "Verified duplicate-write suppression is missing."
          }
          if ($studio -notmatch [regex]::Escape("Duplicate write suppressed locally")) {
            throw "Duplicate-write verified observation correlation is missing."
          }
          if ($broker -notmatch [regex]::Escape("expected_sha256.as_deref().or(before_sha256.as_deref())")) {
            throw "Native post-approval SHA recheck fallback is missing."
          }
          if ($broker -notmatch [regex]::Escape("missing_expected_hash_captures_existing_file_for_safe_recheck")) {
            throw "Native missing-hash regression test is missing."
          }
          if ($planner -match [regex]::Escape("expectedSha256: typeof input.expectedSha256 === 'string' ? input.expectedSha256 : null")) {
            throw "Planner still forces omitted expectedSha256 to null."
          }
          Write-Host "Verified Codex approval/write lifecycle regression contract."

      - name: Test Codex planner regressions including v2
        run: npm run test:api

      - name: Test Codex desktop path contract
        run: node --experimental-strip-types apps/desktop/test/agent-path.test.mjs

      - name: Generate approved Windows icons
        run: npm --workspace apps/desktop run icons

      - name: Build desktop frontend for Tauri tests
        run: npm --workspace apps/desktop run build

      - name: Test native Codex production transport
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml native_transport_reaches_the_live_codex_route -- --nocapture

      - name: Test all Codex local operations on Windows
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml -- --nocapture

      - name: Build Windows installer
        run: npm run desktop:build

      - name: Verify production client configuration
        shell: pwsh
        run: |
          $assets = Get-ChildItem "apps/desktop/dist/assets/*.js"
          $joined = ($assets | Get-Content -Raw) -join "`n"
          if ($joined -notmatch [regex]::Escape($env:VITE_SUPABASE_URL)) {
            throw "Supabase URL was not embedded into the desktop production bundle."
          }
          if ($joined -notmatch [regex]::Escape($env:VITE_SUPABASE_PUBLISHABLE_KEY)) {
            throw "Supabase publishable key was not embedded into the desktop production bundle."
          }
          if ($joined -notmatch [regex]::Escape($env:VITE_API_URL)) {
            throw "Production API URL was not embedded into the desktop production bundle."
          }
          if ($joined -notmatch "farsiai.codex.desktop.v2") {
            throw "Codex Studio v2 marker was not embedded into the Windows production bundle."
          }
          if ($joined -notmatch "0.5.2-codex-studio") {
            throw "Codex Studio v0.5.2 client marker was not embedded into the Windows production bundle."
          }
          Write-Host "Verified production API + Supabase + Codex v0.5.2 configuration in desktop bundle."

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: FarsiAI-Desktop-Windows-v0.5.2-Codex-Approval-Fixed
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/farsiai-desktop.exe
