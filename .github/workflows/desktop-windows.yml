name: Desktop Windows

on:
  workflow_dispatch:
  push:
    branches: [main, "agent/desktop-v0.2*"]
    paths:
      - "apps/desktop/**"
      - "apps/api/**"
      - "package.json"
      - ".github/workflows/desktop-windows.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "apps/api/**"
      - "package.json"

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      VITE_API_URL: https://farsiai-api.sorniamir2005.workers.dev
      VITE_SUPABASE_URL: https://amjeqpkdowiqpnbdnlov.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_dmq29e97vQpib77ne8wVWA_DHuzJ9-U
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Typecheck desktop
        run: npm run check:desktop

      - name: Generate branded desktop icons
        run: npm --workspace apps/desktop run tauri:icon

      - name: Build Windows installer
        run: npm --workspace apps/desktop run tauri:build

      - name: Upload EXE installer
        uses: actions/upload-artifact@v4
        with:
          name: FarsiAI-Desktop-Windows
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
