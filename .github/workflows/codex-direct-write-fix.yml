name: Fix Codex direct-write parser

on:
  push:
    branches: ["agent/codex-pro-v0.4.7"]
    paths:
      - "scripts/fix-codex-direct-write.mjs"
      - ".github/workflows/codex-direct-write-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/codex-pro-v0.4.7
          fetch-depth: 0
      - run: node scripts/fix-codex-direct-write.mjs
      - run: git diff --check
      - shell: bash
        run: |
          git config user.name "FarsiAI Codex CI"
          git config user.email "actions@users.noreply.github.com"
          git add apps/api/src/ai/agent-v2.ts
          git commit -m "Fix Codex direct-write task detection"
          git push origin HEAD:agent/codex-pro-v0.4.7
