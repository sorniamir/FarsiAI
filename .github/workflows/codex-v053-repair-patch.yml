name: Codex v0.5.3 Repair Patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/codex-v053-repair-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Codex planner repair patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/codex_patch.py
          python /tmp/codex_patch.py

      - name: Validate patch locally
        run: |
          npm install
          npm run check:api
          npm run test:api

      - name: Commit and push source changes
        shell: bash
        run: |
          git config user.name "FarsiAI Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/api/src/ai/codex-v2.ts apps/api/test/codex-v2.test.ts
          git diff --cached --check
          git commit -m "fix(codex): repair invalid tool proposals" || exit 0
          git push origin HEAD:main
