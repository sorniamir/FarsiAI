name: Codex v0.5.3 Version Align

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/codex-v053-version-align.yml"

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Align v0.5.3 versions
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/align_versions.py
          python /tmp/align_versions.py
          npm install --package-lock-only
          cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Verify aligned source
        run: |
          npm install
          npm run check:api
          npm run check:desktop
          npm run test:api

      - name: Commit and push version alignment
        shell: bash
        run: |
          git config user.name "FarsiAI Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add package.json package-lock.json apps/api/package.json apps/api/src/index.ts apps/api/test/index.test.ts apps/api/test/codex-v2.test.ts apps/desktop/package.json apps/desktop/src/services/codex.ts apps/desktop/src-tauri/tauri.conf.json apps/desktop/src-tauri/Cargo.toml apps/desktop/src-tauri/Cargo.lock
          git diff --cached --check
          git commit -m "chore: align FarsiAI v0.5.3 versions" || exit 0
          git push origin HEAD:main
