name: Admin Control Center Patch

on:
  push:
    branches: ["agent/admin-control-center-v2"]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/admin-control-center-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic admin patch
        run: node scripts/apply-admin-control-center.mjs
      - name: Install dependencies
        run: npm install
      - name: Typecheck API
        run: npm run check:api
      - name: Test API including admin controls
        run: npm run test:api
      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/index.ts apps/api/src/ai/codex-v2.ts package-lock.json
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "feat(admin): wire control center into production API"
            git push origin HEAD:agent/admin-control-center-v2
          fi
