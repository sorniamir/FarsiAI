name: Admin Owner Hardening

on:
  push:
    branches: ["agent/admin-owner-hardening"]

permissions:
  contents: write

jobs:
  harden:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/admin-owner-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply hardening patch
        run: node scripts/apply-admin-owner-hardening.mjs
      - name: Install dependencies
        run: npm install
      - name: Typecheck API
        run: npm run check:api
      - name: Test API security regressions
        run: npm run test:api
      - name: Commit hardened sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/admin.ts apps/api/src/ai/agent-v2.ts apps/api/test/admin-control-center.test.ts package-lock.json
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "fix(admin): protect owner and legacy Codex bans"
            git push origin HEAD:agent/admin-owner-hardening
          fi
