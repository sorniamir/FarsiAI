name: Patch Codex v0.5.0

on:
  push:
    branches: ["fix/codex-v050-free-plan"]
    paths:
      - ".github/workflows/patch-codex-v050.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/codex-v050-free-plan
      - name: Apply deterministic Codex repair
        shell: python
        run: |
          from pathlib import Path

          codex_path = Path('apps/api/src/ai/codex-v2.ts')
          text = codex_path.read_text(encoding='utf-8')

          old_models = "const MODELS = ['@cf/moonshotai/kimi-k2.7-code', '@cf/zai-org/glm-5.2', '@cf/zai-org/glm-4.7-flash'] as const;"
          new_models = "const MODELS = ['@cf/openai/gpt-oss-120b', '@cf/openai/gpt-oss-20b', '@cf/google/gemma-4-26b-a4b-it', '@cf/zai-org/glm-4.7-flash'] as const;"
          assert old_models in text
          text = text.replace(old_models, new_models, 1)

          old_tools = '''function toolCallCandidate(result: any): any {
            const candidates = [result, result?.result, result?.data, result?.result?.result].filter(Boolean);
            for (const item of candidates) {
              const call = item?.tool_calls?.[0] ?? item?.choices?.[0]?.message?.tool_calls?.[0];
              if (call) return call;
            }
            return null;
          }

          function responseText(result: any): string {
            const candidates = [result, result?.result, result?.data, result?.result?.result].filter(Boolean);
            for (const item of candidates) {
              const text = item?.response ?? item?.choices?.[0]?.message?.content;
              if (typeof text === 'string' && text.trim()) return sanitizeText(text, 9000).trim();
            }
            return '';
          }'''
          new_tools = '''function toolCallCandidate(result: any): any {
            const candidates = [result, result?.result, result?.data, result?.result?.result].filter(Boolean);
            for (const item of candidates) {
              const call = item?.tool_calls?.[0]
                ?? item?.choices?.[0]?.message?.tool_calls?.[0]
                ?? item?.output?.find?.((entry: any) => entry?.type === 'function_call');
              if (call) return call;
            }
            return null;
          }

          function responseText(result: any): string {
            const candidates = [result, result?.result, result?.data, result?.result?.result].filter(Boolean);
            for (const item of candidates) {
              const direct = item?.response ?? item?.choices?.[0]?.message?.content ?? item?.output_text;
              if (typeof direct === 'string' && direct.trim()) return sanitizeText(direct, 9000).trim();
              if (Array.isArray(item?.output)) {
                for (const entry of item.output) {
                  if (entry?.type !== 'message' || !Array.isArray(entry?.content)) continue;
                  for (const part of entry.content) {
                    if ((part?.type === 'output_text' || part?.type === 'text') && typeof part?.text === 'string' && part.text.trim()) {
                      return sanitizeText(part.text, 9000).trim();
                    }
                  }
                }
              }
            }
            return '';
          }'''
          assert old_tools in text
          text = text.replace(old_tools, new_tools, 1)

          old_id = "const rawId = typeof call?.id === 'string' && /^[\\w.:-]{1,160}$/.test(call.id) ? call.id : `call-${requestId}-${crypto.randomUUID()}`;"
          new_id = "const candidateId = call?.id ?? call?.call_id;\n  const rawId = typeof candidateId === 'string' && /^[\\w.:-]{1,160}$/.test(candidateId) ? candidateId : `call-${requestId}-${crypto.randomUUID()}`;"
          assert old_id in text
          text = text.replace(old_id, new_id, 1)

          old_runner = '''async function runModel(env: Env, input: Record<string, unknown>, requireTool: boolean): Promise<{ result: any; model: string }> {
            let last: unknown;
            for (const model of MODELS) {
              try {
                const result = await env.AI.run(model, model === '@cf/zai-org/glm-5.2' ? { ...input, reasoning_effort: 'medium' } : input);
                if (requireTool && !toolCallCandidate(result)) { last = new Error('required tool missing'); continue; }
                if (!toolCallCandidate(result) && !responseText(result)) { last = new Error('empty model output'); continue; }
                return { result, model };
              } catch (error) { last = error; }
            }
            throw last instanceof Error ? last : new Error('No Codex model is available.');
          }'''
          new_runner = '''function compatibleModelInput(input: Record<string, unknown>): Record<string, unknown> {
            const next = { ...input };
            delete next.parallel_tool_calls;
            delete next.tool_choice;
            if (typeof next.max_completion_tokens === 'number') {
              next.max_tokens = next.max_completion_tokens;
              delete next.max_completion_tokens;
            }
            return next;
          }

          async function runModel(env: Env, input: Record<string, unknown>, requireTool: boolean): Promise<{ result: any; model: string }> {
            let last: unknown;
            for (const model of MODELS) {
              for (const compatibilityMode of [false, true]) {
                try {
                  const modelInput = compatibilityMode ? compatibleModelInput(input) : input;
                  const result = await env.AI.run(model, modelInput);
                  const tool = toolCallCandidate(result);
                  if (requireTool && !tool) {
                    last = new Error('required tool missing');
                    continue;
                  }
                  if (!tool && !responseText(result)) {
                    last = new Error('empty model output');
                    continue;
                  }
                  console.log(JSON.stringify({ event: 'codex_v2_model_success', model, compatibilityMode, tool: Boolean(tool) }));
                  return { result, model };
                } catch (error) {
                  last = error;
                  console.warn(JSON.stringify({
                    event: 'codex_v2_model_failed',
                    model,
                    compatibilityMode,
                    message: error instanceof Error ? error.message : 'unknown_model_error',
                  }));
                }
              }
            }
            throw last instanceof Error ? last : new Error('No Codex model is available.');
          }'''
          assert old_runner in text
          text = text.replace(old_runner, new_runner, 1)

          codex_path.write_text(text, encoding='utf-8')

          voice_path = Path('apps/api/src/ai/voice.ts')
          voice = voice_path.read_text(encoding='utf-8')
          old_voice = '''    const wav = audioAsWav(audio);
              console.log(JSON.stringify({ event: 'voice_synthesis_success', requestId, model: audio.model, bytes: wav.length }));
              return new Response(wav, {'''
          new_voice = '''    const wav = audioAsWav(audio);
              const body = new Uint8Array(wav.byteLength);
              body.set(wav);
              console.log(JSON.stringify({ event: 'voice_synthesis_success', requestId, model: audio.model, bytes: wav.length }));
              return new Response(body.buffer, {'''
          assert old_voice in voice
          voice_path.write_text(voice.replace(old_voice, new_voice, 1), encoding='utf-8')

      - name: Show patch
        run: git diff --check && git diff --stat && git diff -- apps/api/src/ai/codex-v2.ts apps/api/src/ai/voice.ts
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "FarsiAI CI"
          git config user.email "actions@users.noreply.github.com"
          git add apps/api/src/ai/codex-v2.ts apps/api/src/ai/voice.ts
          git commit -m "fix(codex): use live-tested free-plan coding models"
          git push origin HEAD:fix/codex-v050-free-plan
