name: Apply Codex Pro patch

on:
  push:
    branches: ["agent/codex-pro-v0.4.7"]
    paths:
      - "scripts/apply-codex-pro-patch.mjs"
      - ".github/workflows/codex-pro-apply.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'Apply Codex Pro source patch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/codex-pro-v0.4.7
          fetch-depth: 0

      - name: Apply deterministic source patch
        run: node scripts/apply-codex-pro-patch.mjs

      - name: Verify diff scope
        run: |
          git status --short
          git diff --check
          git diff -- apps/api/src/index.ts apps/desktop/src/App.tsx apps/desktop/src-tauri/src/tools.rs apps/desktop/package.json apps/desktop/src-tauri/tauri.conf.json apps/api/package.json .github/workflows/desktop-windows.yml

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "FarsiAI Codex CI"
          git config user.email "actions@users.noreply.github.com"
          git add apps/api/src/index.ts apps/desktop/src/App.tsx apps/desktop/src-tauri/src/tools.rs apps/desktop/package.json apps/desktop/src-tauri/tauri.conf.json apps/api/package.json .github/workflows/desktop-windows.yml
          git commit -m "Apply Codex Pro source patch"
          git push origin HEAD:agent/codex-pro-v0.4.7
