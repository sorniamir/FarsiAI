name: Codex AI Live Probe

on:
  push:
    branches: ["agent/codex-ai-probe"]
  workflow_dispatch:

jobs:
  live-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe real Workers AI tool calling
        shell: bash
        run: |
          set -euo pipefail
          URL="https://agent-codex-ai-probe-farsiai-api.sorniamir2005.workers.dev/codex-ai-probe"
          STATUS=$(curl --silent --show-error --max-time 120 --output /tmp/codex-probe.json --write-out "%{http_code}" "$URL")
          echo "HTTP $STATUS"
          cat /tmp/codex-probe.json
          echo
          node - <<'NODE'
          const fs = require('fs');
          const body = fs.readFileSync('/tmp/codex-probe.json', 'utf8');
          const data = JSON.parse(body);
          if (data.ok !== true || !Array.isArray(data.successes) || data.successes.length === 0) {
            throw new Error(`Workers AI live probe failed: ${body}`);
          }
          const primary = data.successes.find((x) => x.model === '@cf/openai/gpt-oss-120b');
          if (!primary || primary.toolName !== 'read_file') {
            throw new Error(`GPT-OSS 120B did not return the required tool call: ${body}`);
          }
          for (const item of data.successes) {
            console.log(`[codex-live-probe] PASS model=${item.model} mode=${item.mode} shape=${item.shape} tool=${item.toolName}`);
          }
          NODE
