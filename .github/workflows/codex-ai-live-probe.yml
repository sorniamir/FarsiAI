name: Codex AI Live Probe

on:
  push:
    branches: ["agent/codex-ai-probe"]
  workflow_dispatch:

jobs:
  live-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe real Workers AI tool calling
        shell: bash
        run: |
          set -euo pipefail
          URL="https://agent-codex-ai-probe-farsiai-api.sorniamir2005.workers.dev/codex-ai-probe"
          echo "Probing live Workers AI preview..."
          STATUS=$(curl --silent --show-error --max-time 95 --output /tmp/codex-probe.json --write-out "%{http_code}" "$URL")
          echo "HTTP $STATUS"
          cat /tmp/codex-probe.json
          echo
          node - <<'NODE'
          const fs = require('fs');
          const body = fs.readFileSync('/tmp/codex-probe.json', 'utf8');
          const data = JSON.parse(body);
          if (data.ok !== true) {
            throw new Error(`Workers AI live probe failed: ${body}`);
          }
          if (data.toolName !== 'read_file') {
            throw new Error(`Unexpected tool: ${data.toolName}`);
          }
          if (typeof data.model !== 'string' || !data.model) {
            throw new Error('No model reported');
          }
          console.log(`[codex-live-probe] PASS model=${data.model} tool=${data.toolName}`);
          NODE
