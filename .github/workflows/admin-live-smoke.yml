name: Admin Live Smoke

on:
  push:
    branches: ["agent/admin-live-smoke"]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify deployed Admin Control Center
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://agent-admin-control-center-v2-farsiai-api.sorniamir2005.workers.dev"
          STATUS="000"
          for attempt in $(seq 1 24); do
            STATUS=$(curl --silent --show-error --max-time 30 -D /tmp/admin.headers -o /tmp/admin.html -w "%{http_code}" "$BASE/admin" || true)
            echo "admin attempt=$attempt status=$STATUS"
            if [ "$STATUS" = "200" ]; then break; fi
            sleep 5
          done
          test "$STATUS" = "200"
          grep -Fq "FarsiAI Control Center" /tmp/admin.html
          grep -Eiq '^x-frame-options:[[:space:]]*DENY' /tmp/admin.headers
          grep -Eiq '^content-security-policy:.*frame-ancestors .none.' /tmp/admin.headers

          ADMIN_STATUS=$(curl --silent --show-error --max-time 30 -o /tmp/admin-me.json -w "%{http_code}" "$BASE/v1/admin/me")
          echo "admin api unauthenticated status=$ADMIN_STATUS"
          test "$ADMIN_STATUS" = "401"
          grep -Fq '"ok":false' /tmp/admin-me.json
          echo "Admin live smoke PASS"
