name: Provider Runtime Smoke

on:
  push:
    branches:
      - agent/fix-image-production-v063

concurrency:
  group: provider-runtime-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe production image endpoint and preview provider diagnostics
        shell: bash
        env:
          PROD_URL: https://farsiai-api.sorniamir2005.workers.dev
          PREVIEW_URL: https://agent-fix-image-production-v063-farsiai-api.sorniamir2005.workers.dev
        run: |
          node <<'NODE'
          async function waitForHealth(base, expectedService) {
            let last = '';
            for (let attempt = 1; attempt <= 24; attempt++) {
              try {
                const response = await fetch(`${base}/health`, { signal: AbortSignal.timeout(10000) });
                const text = await response.text();
                last = `${response.status} ${text}`;
                if (response.ok && (!expectedService || text.includes(expectedService))) return last;
              } catch (error) {
                last = error instanceof Error ? error.message : String(error);
              }
              await new Promise((resolve) => setTimeout(resolve, 5000));
            }
            throw new Error(`health unavailable: ${last}`);
          }

          console.log('PRODUCTION HEALTH:', await waitForHealth(process.env.PROD_URL, 'farsiai-api'));
          const prod = await fetch(`${process.env.PROD_URL}/v1/ai`, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({
              mode: 'image',
              imageAction: 'generate',
              message: 'A single red apple centered on a clean white studio background, photorealistic product photo',
            }),
            signal: AbortSignal.timeout(120000),
          });
          const prodText = await prod.text();
          let prodPayload = {};
          try { prodPayload = JSON.parse(prodText); } catch {}
          console.log('PRODUCTION RESULT:', JSON.stringify({
            status: prod.status,
            ok: prodPayload?.ok,
            provider: prodPayload?.provider,
            code: prodPayload?.code,
            requestId: prodPayload?.requestId,
            error: prodPayload?.error,
            hasImage: typeof prodPayload?.image === 'string' && prodPayload.image.startsWith('data:image/'),
          }));

          console.log('PREVIEW HEALTH:', await waitForHealth(process.env.PREVIEW_URL, 'farsiai-image-runtime-diagnostic'));
          const diag = await fetch(`${process.env.PREVIEW_URL}/diag`, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            signal: AbortSignal.timeout(240000),
          });
          const diagText = await diag.text();
          console.log('PREVIEW DIAGNOSTIC STATUS:', diag.status);
          console.log('PREVIEW DIAGNOSTIC:', diagText);

          if (!diag.ok) process.exit(1);
          NODE
