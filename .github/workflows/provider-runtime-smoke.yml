name: Provider Runtime Smoke

on:
  push:
    branches:
      - agent/fix-image-production-v063

concurrency:
  group: provider-runtime-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe production and preview image generation
        shell: bash
        env:
          PROD_URL: https://farsiai-api.sorniamir2005.workers.dev
          PREVIEW_URL: https://agent-fix-image-production-v063-farsiai-api.sorniamir2005.workers.dev
        run: |
          node <<'NODE'
          const targets = [
            ['production', process.env.PROD_URL],
            ['preview', process.env.PREVIEW_URL],
          ];

          async function waitForHealth(name, base) {
            let last = '';
            for (let attempt = 1; attempt <= 18; attempt++) {
              try {
                const response = await fetch(`${base}/health`, { signal: AbortSignal.timeout(10000) });
                last = `${response.status} ${await response.text()}`;
                if (response.ok) return last;
              } catch (error) {
                last = error instanceof Error ? error.message : String(error);
              }
              await new Promise((resolve) => setTimeout(resolve, 5000));
            }
            throw new Error(`${name} health unavailable: ${last}`);
          }

          async function probe(name, base) {
            const health = await waitForHealth(name, base);
            console.log(`HEALTH ${name}: ${health.slice(0, 300)}`);
            const response = await fetch(`${base}/v1/ai`, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({
                mode: 'image',
                imageAction: 'generate',
                message: 'A single red apple centered on a clean white studio background, photorealistic product photo',
              }),
              signal: AbortSignal.timeout(120000),
            });

            const text = await response.text();
            let payload = {};
            try { payload = JSON.parse(text); } catch {}
            const summary = {
              status: response.status,
              ok: payload?.ok,
              mode: payload?.mode,
              provider: payload?.provider,
              code: payload?.code,
              requestId: payload?.requestId,
              error: payload?.error,
              edited: payload?.edited,
              hasImage: typeof payload?.image === 'string' && payload.image.startsWith('data:image/'),
              imageLength: typeof payload?.image === 'string' ? payload.image.length : 0,
              rawPrefix: text.slice(0, 220),
            };
            console.log(`RESULT ${name}: ${JSON.stringify(summary)}`);
            return response.ok && payload?.ok === true && summary.hasImage;
          }

          let allOk = true;
          for (const [name, base] of targets) {
            try {
              const ok = await probe(name, base);
              if (!ok) allOk = false;
            } catch (error) {
              allOk = false;
              console.error(`ERROR ${name}:`, error instanceof Error ? error.stack : error);
            }
          }
          if (!allOk) process.exit(1);
          NODE
