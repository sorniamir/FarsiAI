name: Provider Runtime Smoke

on:
  push:
    branches:
      - agent/fix-image-production-v063

concurrency:
  group: provider-runtime-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify production returns a real Persian-generated image after rollout
        shell: bash
        env:
          PROD_URL: https://farsiai-api.sorniamir2005.workers.dev
        run: |
          node <<'NODE'
          const base = process.env.PROD_URL;
          const body = JSON.stringify({
            mode: 'image',
            imageAction: 'generate',
            message: 'یک سیب قرمز در مرکز یک میز سفید، عکاسی استودیویی واقع‌گرایانه با نور حرفه‌ای و پس‌زمینه تمیز',
          });

          let last = null;
          for (let attempt = 1; attempt <= 24; attempt++) {
            try {
              const healthResponse = await fetch(`${base}/health`, { signal: AbortSignal.timeout(10000) });
              const health = `${healthResponse.status} ${await healthResponse.text()}`;
              console.log(`HEALTH attempt ${attempt}:`, health.slice(0, 220));

              const response = await fetch(`${base}/v1/ai`, {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body,
                signal: AbortSignal.timeout(120000),
              });
              const text = await response.text();
              let payload = {};
              try { payload = JSON.parse(text); } catch {}
              last = {
                attempt,
                status: response.status,
                ok: payload?.ok,
                provider: payload?.provider,
                error: payload?.error,
                edited: payload?.edited,
                hasImage: typeof payload?.image === 'string' && payload.image.startsWith('data:image/'),
                imageLength: typeof payload?.image === 'string' ? payload.image.length : 0,
              };
              console.log('RESULT:', JSON.stringify(last));
              if (response.ok && payload?.ok === true && last.hasImage && payload?.provider === 'pollinations:legacy-flux') {
                process.exit(0);
              }
            } catch (error) {
              last = { attempt, error: error instanceof Error ? error.message : String(error) };
              console.error('ATTEMPT ERROR:', JSON.stringify(last));
            }
            await new Promise((resolve) => setTimeout(resolve, 5000));
          }
          console.error('FINAL FAILURE:', JSON.stringify(last));
          process.exit(1);
          NODE
