name: Provider Runtime Smoke

on:
  push:
    branches:
      - agent/fix-image-production-v063

concurrency:
  group: provider-runtime-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify clean preview returns a real Persian-generated image
        shell: bash
        env:
          PREVIEW_URL: https://agent-image-provider-fallback-v063-farsiai-api.sorniamir2005.workers.dev
        run: |
          node <<'NODE'
          const base = process.env.PREVIEW_URL;
          let health = '';
          for (let attempt = 0; attempt < 18; attempt++) {
            try {
              const response = await fetch(`${base}/health`, { signal: AbortSignal.timeout(10000) });
              health = `${response.status} ${await response.text()}`;
              if (response.ok && health.includes('farsiai-api')) break;
            } catch (error) {
              health = error instanceof Error ? error.message : String(error);
            }
            await new Promise((resolve) => setTimeout(resolve, 5000));
          }
          console.log('HEALTH:', health.slice(0, 300));

          const response = await fetch(`${base}/v1/ai`, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({
              mode: 'image',
              imageAction: 'generate',
              message: 'یک سیب قرمز در مرکز یک میز سفید، عکاسی استودیویی واقع‌گرایانه با نور حرفه‌ای و پس‌زمینه تمیز',
            }),
            signal: AbortSignal.timeout(120000),
          });
          const text = await response.text();
          let payload = {};
          try { payload = JSON.parse(text); } catch {}
          const summary = {
            status: response.status,
            ok: payload?.ok,
            mode: payload?.mode,
            provider: payload?.provider,
            error: payload?.error,
            edited: payload?.edited,
            hasImage: typeof payload?.image === 'string' && payload.image.startsWith('data:image/'),
            imageLength: typeof payload?.image === 'string' ? payload.image.length : 0,
          };
          console.log('RESULT:', JSON.stringify(summary));
          if (!response.ok || payload?.ok !== true || !summary.hasImage) process.exit(1);
          if (payload?.provider !== 'pollinations:legacy-flux') process.exit(2);
          NODE
