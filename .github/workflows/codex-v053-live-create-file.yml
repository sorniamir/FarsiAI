name: Codex v0.5.3 Live Create File

on:
  push:
    branches: ["agent/codex-ai-probe"]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe real Workers AI create-file tool calling
        shell: bash
        run: |
          set -euo pipefail
          URL="https://agent-codex-ai-probe-farsiai-api.sorniamir2005.workers.dev/codex-create-file-probe"
          STATUS="000"
          for attempt in $(seq 1 30); do
            STATUS=$(curl --silent --show-error --max-time 120 --output /tmp/codex-v053-probe.json --write-out "%{http_code}" "$URL" || true)
            echo "attempt=$attempt HTTP=$STATUS"
            if [ "$STATUS" = "200" ]; then break; fi
            sleep 10
          done
          cat /tmp/codex-v053-probe.json || true
          echo
          test "$STATUS" = "200"
          node - <<'NODE'
          const fs = require('fs');
          const body = fs.readFileSync('/tmp/codex-v053-probe.json', 'utf8');
          const data = JSON.parse(body);
          if (data.ok !== true || data.scenario !== 'create-empty-document.txt') {
            throw new Error(`Codex live create-file probe failed: ${body}`);
          }
          const primary = data.results?.find((item) => item.model === '@cf/openai/gpt-oss-120b');
          if (!primary || primary.ok !== true || primary.toolName !== 'write_file') {
            throw new Error(`GPT-OSS 120B did not produce a valid write_file call: ${body}`);
          }
          if (primary.arguments?.path !== 'document.txt' || typeof primary.arguments?.content !== 'string') {
            throw new Error(`GPT-OSS 120B returned invalid write_file arguments: ${body}`);
          }
          console.log(`[codex-v053-live] PASS primary=${primary.model} repaired=${primary.repaired} path=${primary.arguments.path} contentLength=${primary.arguments.content.length}`);
          for (const item of data.results || []) {
            console.log(`[codex-v053-live] model=${item.model} ok=${item.ok} repaired=${item.repaired ?? false} tool=${item.toolName ?? '-'} mode=${item.mode ?? '-'}`);
          }
          NODE
