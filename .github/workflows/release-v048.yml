name: FarsiAI v0.4.8 Release Build

on:
  push:
    branches: ["agent/farsiai-v0.4.8-codex-voice"]
  workflow_dispatch:

jobs:
  desktop-windows:
    runs-on: windows-latest
    env:
      VITE_API_URL: https://farsiai-api.sorniamir2005.workers.dev
      VITE_SUPABASE_URL: https://amjeqpkdowiqpnbdnlov.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_dmq29e97vQpib77ne8wVWA_DHuzJ9-U
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified v0.4.8 source overlay
        shell: pwsh
        run: |
          $encoded = (Get-ChildItem ci/farsiai-v048-overlay.b64.* | Sort-Object Name | Get-Content -Raw) -join ''
          $archive = Join-Path $env:RUNNER_TEMP 'farsiai-v048-overlay.zip'
          [IO.File]::WriteAllBytes($archive, [Convert]::FromBase64String($encoded))
          Expand-Archive -LiteralPath $archive -DestinationPath . -Force
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - run: npm run check:desktop
      - run: npm run test:api
      - run: node --experimental-strip-types apps/desktop/test/agent-path.test.mjs
      - run: npm --workspace apps/desktop run icons
      - run: npm --workspace apps/desktop run build
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml -- --nocapture
      - run: npm run desktop:build
      - name: Verify installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $installer -or $installer.Length -lt 1000000) { throw "Windows installer missing or too small" }
          Get-FileHash -Algorithm SHA256 $installer.FullName
      - uses: actions/upload-artifact@v4
        with:
          name: FarsiAI-Desktop-Setup-v0.4.8
          if-no-files-found: error
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe

  android-apk:
    runs-on: ubuntu-latest
    env:
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_API_URL: https://farsiai-api.sorniamir2005.workers.dev
      EXPO_PUBLIC_SUPABASE_URL: https://amjeqpkdowiqpnbdnlov.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_dmq29e97vQpib77ne8wVWA_DHuzJ9-U
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified v0.4.8 source overlay
        run: |
          cat ci/farsiai-v048-overlay.b64.* | base64 --decode > /tmp/farsiai-v048-overlay.zip
          unzip -o /tmp/farsiai-v048-overlay.zip || [ "$?" -eq 1 ]
          chmod -R u+rwX,go+rX apps package.json pnpm-workspace.yaml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm install
      - name: Link Codex native module
        run: npm install ./apps/mobile/modules/codex-device --workspace apps/mobile --no-save
      - run: npm run check:mobile
      - name: Verify Expo module autolinking
        working-directory: apps/mobile
        run: npx expo-modules-autolinking resolve --platform android | grep -q "CodexDeviceModule"
      - name: Generate Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean --non-interactive
      - name: Build release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Verify APK
        run: |
          test -f apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          test $(stat -c%s apps/mobile/android/app/build/outputs/apk/release/app-release.apk) -gt 1000000
          sha256sum apps/mobile/android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FarsiAI-Mobile-v0.4.8
          if-no-files-found: error
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk

