name: Admin Production Smoke

on:
  push:
    branches: ["agent/admin-live-smoke"]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Verify production Admin Control Center
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://farsiai-api.sorniamir2005.workers.dev"
          STATUS="000"
          for attempt in $(seq 1 36); do
            STATUS=$(curl --silent --show-error --max-time 30 -D /tmp/admin.headers -o /tmp/admin.html -w "%{http_code}" "$BASE/admin" || true)
            echo "production admin attempt=$attempt status=$STATUS"
            if [ "$STATUS" = "200" ] && grep -Fq "FarsiAI Control Center" /tmp/admin.html; then break; fi
            sleep 5
          done
          test "$STATUS" = "200"
          grep -Fq "FarsiAI Control Center" /tmp/admin.html
          grep -Eiq '^x-frame-options:[[:space:]]*DENY' /tmp/admin.headers
          grep -Eiq '^content-security-policy:.*frame-ancestors .none.' /tmp/admin.headers
          ADMIN_STATUS=$(curl --silent --show-error --max-time 30 -o /tmp/admin-me.json -w "%{http_code}" "$BASE/v1/admin/me")
          echo "production admin api unauthenticated status=$ADMIN_STATUS"
          test "$ADMIN_STATUS" = "401"
          echo "Production Admin smoke PASS"
