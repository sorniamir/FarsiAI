name: Finalize Codex Pro tests

on:
  push:
    branches: ["agent/codex-pro-v0.4.7"]
    paths:
      - "scripts/finalize-codex-pro-tests.mjs"
      - ".github/workflows/codex-pro-finalize.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'Finalize Codex Pro planner and regressions'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/codex-pro-v0.4.7
          fetch-depth: 0

      - name: Apply Codex Pro finalizer
        run: node scripts/finalize-codex-pro-tests.mjs

      - name: Verify
        run: |
          git diff --check
          git status --short

      - name: Commit
        shell: bash
        run: |
          git config user.name "FarsiAI Codex CI"
          git config user.email "actions@users.noreply.github.com"
          git add apps/api/src/ai/agent-v2.ts apps/api/test/index.test.ts apps/api/test/desktop-regressions.test.ts
          git commit -m "Finalize Codex Pro planner and regressions"
          git push origin HEAD:agent/codex-pro-v0.4.7
